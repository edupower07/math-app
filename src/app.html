/* ============================================================

var Server = {

    return new Promise(function (resolve, reject) {

      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args || []);
    });

/* ============================================================
 *  Engine: 数の性質・手がかり（基本＋単元）
 * ============================================================ */
var Engine = {
  gcd: function (a, b) { while (b) { var t = b; b = a % b; a = t; } return a; },
  digitsOf: function (n) { return String(n).length; },

  /** 手がかり記述子から {desc, cat, tag, text, short, match} を作る
   *  short … タップ指示に使う短い言い方（例「3の倍数」） */
  makeHint: function (d) {
    var cat = d.category, tag = '', text = '', short = '', match;
    if (cat === 'basic') {
      cat = 'basic';
      if (d.kind === 'gt') { tag = '大小'; text = '犯人の数は【' + d.v + '】より 大きい'; short = d.v + 'より大きい数'; match = function (n) { return n > d.v; }; }
      else if (d.kind === 'lt') { tag = '大小'; text = '犯人の数は【' + d.v + '】より 小さい'; short = d.v + 'より小さい数'; match = function (n) { return n < d.v; }; }
      else if (d.kind === 'ones') { tag = '一の位'; text = '一の位は【' + d.d + '】'; short = '一の位が' + d.d + 'の数'; match = function (n) { return n % 10 === d.d; }; }
      else if (d.kind === 'digits') { tag = 'けた'; text = '【' + d.k + '】けたの数'; short = d.k + 'けたの数'; match = function (n) { return Engine.digitsOf(n) === d.k; }; }
    } else if (cat === 'parity') {
      var isEven = d.parity === 'even';
      tag = CATS.parity.tag;
      text = '犯人の数は ' + (isEven ? '偶数（ぐうすう）' : '奇数（きすう）');
      short = isEven ? '偶数' : '奇数';
      match = function (n) { return (n % 2 === 0) === isEven; };
    } else if (cat === 'multiple') {
      tag = CATS.multiple.tag; text = '犯人の数は【' + d.k + '】の倍数'; short = d.k + 'の倍数';
      match = function (n) { return n % d.k === 0; };
    } else if (cat === 'divisor') {
      tag = CATS.divisor.tag; text = '犯人の数は【' + d.k + '】の約数'; short = d.k + 'の約数';
      match = function (n) { return d.k % n === 0; };
    } else if (cat === 'cmul') {
      tag = CATS.cmul.tag; text = '犯人の数は【' + d.a + '】と【' + d.b + '】の公倍数'; short = d.a + 'と' + d.b + 'の公倍数';
      match = function (n) { return n % d.a === 0 && n % d.b === 0; };
    } else if (cat === 'cdiv') {
      tag = CATS.cdiv.tag; text = '犯人の数は【' + d.a + '】と【' + d.b + '】の公約数'; short = d.a + 'と' + d.b + 'の公約数';
      match = function (n) { return d.a % n === 0 && d.b % n === 0; };
    }
    return { desc: d, cat: cat, tag: tag, text: text, short: short, match: match };
  },

  candidates: function (hints, range) {
    var out = [];
    for (var n = 1; n <= range; n++) {
      var ok = true;
      for (var i = 0; i < hints.length; i++) { if (!hints[i].match(n)) { ok = false; break; } }
      if (ok) out.push(n);
    }
    return out;
  },

  /** secret にあてはまる手がかりプールを作る（基本＋解禁済み単元） */
  buildPool: function (secret, cats, range) {
    var pool = [], push = function (d) { pool.push(Engine.makeHint(d)); };

    // --- 基本の手がかり（いつでも使える） ---
    // 大小（切りのよい数で）
    for (var g = 5; g < secret; g += 5) push({ category: 'basic', kind: 'gt', v: g });
    for (var l = Math.ceil((secret + 1) / 5) * 5; l <= range; l += 5) push({ category: 'basic', kind: 'lt', v: l });
    // 一の位（強い手がかり）
    push({ category: 'basic', kind: 'ones', d: secret % 10 });
    // けた数
    if (range >= 10) push({ category: 'basic', kind: 'digits', k: Engine.digitsOf(secret) });

    // --- 単元の手がかり ---
    if (cats.indexOf('parity') >= 0) push({ category: 'parity', parity: secret % 2 === 0 ? 'even' : 'odd' });
    if (cats.indexOf('multiple') >= 0) { for (var k = 2; k <= 12; k++) { if (secret % k === 0 && k < secret) push({ category: 'multiple', k: k }); } }
    if (cats.indexOf('divisor') >= 0) {
      [12, 16, 18, 20, 24, 28, 30, 36, 40, 42, 48, 60, 72, 80, 90, 96, 100].forEach(function (m) {
        if (m <= range && m % secret === 0 && m > secret) push({ category: 'divisor', k: m });
      });
    }
    if (cats.indexOf('cmul') >= 0) { for (var a = 2; a <= 6; a++) { for (var b = a + 1; b <= 8; b++) { if (secret % a === 0 && secret % b === 0) push({ category: 'cmul', a: a, b: b }); } } }
    if (cats.indexOf('cdiv') >= 0) {
      [[2, 3], [2, 5], [3, 4], [2, 4]].forEach(function (p) {
        var a = secret * p[0], b = secret * p[1];
        if (Engine.gcd(a, b) === secret) push({ category: 'cdiv', a: a, b: b });
      });
    }
    return pool;
  },

  /**
   * プールから貪欲に選び、候補が1つになる手がかり列を返す。
   * 単元カテゴリ（preferUnit）を優先的に採用して「学習内容」を前面に出す。
   */
  greedy: function (pool, range, maxHints) {
    var chosen = [], remaining = pool.slice(), current = null;
    var isUnit = function (h) { return h.cat !== 'basic'; };
    for (var step = 0; step < (maxHints || 5); step++) {
      // まず単元カテゴリで一番よく絞れるものを探す
      var pick = Engine._bestReducer(chosen, remaining, range, current, true);
      if (pick.idx < 0) pick = Engine._bestReducer(chosen, remaining, range, current, false);
      if (pick.idx < 0) break;
      chosen.push(remaining[pick.idx]);
      remaining.splice(pick.idx, 1);
      current = pick.cand;
      if (current.length === 1) break;
    }
    return { hints: chosen, candidates: current || Engine.candidates(chosen, range) };
  },
  _bestReducer: function (chosen, remaining, range, current, unitOnly) {
    var best = -1, bestCount = 1e9, bestCand = null;
    for (var i = 0; i < remaining.length; i++) {
      if (unitOnly && remaining[i].cat === 'basic') continue;
      var cand = Engine.candidates(chosen.concat([remaining[i]]), range);
      if (cand.length < bestCount && (!current || cand.length < current.length)) {
        best = i; bestCount = cand.length; bestCand = cand;
      }
    }
    return { idx: best, cand: bestCand };
  },

  /** ひみつの数当て問題を生成（必ず1つに絞れる） */
  generatePuzzle: function (cats, range) {
    for (var attempt = 0; attempt < 80; attempt++) {
      var secret = 2 + Math.floor(Math.random() * (range - 1));
      var pool = Engine.buildPool(secret, cats, range);
      var res = Engine.greedy(pool, range, 5);
      // 手がかりが少なすぎ／多すぎを避け、2〜5個で一意になるものを採用
      if (res.candidates.length === 1 && res.candidates[0] === secret && res.hints.length >= 2 && res.hints.length <= 5) {
        return { secret: secret, range: range, hints: res.hints };
      }
    }
    // 保険: 一意化できなければ、ぴたり範囲の手がかりで必ず1つにする
    var s = 2 + Math.floor(Math.random() * (range - 1));
    var pool2 = Engine.buildPool(s, cats, range);
    pool2.push(Engine.makeHint({ category: 'basic', kind: 'gt', v: s - 1 }));
    pool2.push(Engine.makeHint({ category: 'basic', kind: 'lt', v: s + 1 }));
    var res2 = Engine.greedy(pool2, range, 6);
    return { secret: s, range: range, hints: res2.hints };
  }
};

/* ============================================================
 *  Game: 能動的な推理（自分でしぼりこむ方式）
 *
 *  流れ:
 *    1) 「手がかりを調べる」で証拠を1つ出す
 *    2) その手がかりに“合うマス”を自分で全部タップして選ぶ（ドラッグも可）
 *    3) 全部えらぶと、合わないマスが消え、犯人候補が濃くなる
 *    4) 候補が1つになったら＝犯人。スポットライト演出で解決！
 * ============================================================ */
var Game = {
  puzzle: null, range: 50, solved: false, caseNo: 1,
  roundIdx: -1, selecting: false, finalGuess: false,
  alive: {}, curHint: null, matchSet: {}, matchList: [], matchCount: 0, kept: {}, keptCount: 0,
  dragging: false, dragMoved: false, downRef: null, downProcessed: false,

  currentCats: function () { return APP.levelMode ? Progress.personalCats() : APP.cats; },
  currentRange: function () { return APP.levelMode ? Progress.personalRange() : APP.range; },

  toggleLevel: function () {
    APP.levelMode = !APP.levelMode;
    Game.updateLevelToggle();
    Game.newGame();
    UI.toast(APP.levelMode ? 'じぶんレベルで挑戦！' : 'クラスのフェーズで挑戦');
  },
  updateLevelToggle: function () {
    var b = document.getElementById('levelToggle');
    if (!b) return;
    b.classList.toggle('on', APP.levelMode);
    b.textContent = (APP.levelMode ? '🎓 じぶんレベル：ON' : '🎓 じぶんレベルで挑戦') +
      (APP.levelMode ? '（1〜' + Progress.personalRange() + '）' : '');
  },

  newGame: function () {
    var r = Game.currentRange();
    Game.setup(Engine.generatePuzzle(Game.currentCats(), r), r);
  },

  /** 任意の問題をセット（作問プレイ・認定試験でも使う） */
  setup: function (puzzle, range, brief) {
    Game.puzzle = puzzle; Game.range = range;
    Game.solved = false; Game.selecting = false; Game.finalGuess = false;
    Game.roundIdx = -1;
    Game.alive = {}; for (var n = 1; n <= range; n++) Game.alive[n] = true;
    Game.kept = {}; Game.keptCount = 0; Game.matchList = []; Game.matchSet = {}; Game.matchCount = 0;
    Game.caseNo++;
    document.getElementById('caseNo').textContent = ('00' + Game.caseNo).slice(-3);
    document.getElementById('rangeLabel2').textContent = range;
    document.getElementById('caseBrief').textContent = brief ||
      'この中に「ひみつの数」が ひとりだけ かくれている。手がかりを調べて、合う数を自分でタップしてしぼりこめ！';
    document.getElementById('usedHints').textContent = '0';
    document.getElementById('totalHints').textContent = puzzle.hints.length;
    document.getElementById('candidateCount').textContent = range;
    Game.buildGrid(range);
    document.getElementById('numberGrid').classList.remove('revealing');
    document.getElementById('clueList').innerHTML =
      '<div class="clue-placeholder">「手がかりを調べる」を押して、捜査スタート！</div>';
    var btn = document.getElementById('revealBtn');
    btn.disabled = false; btn.textContent = '🔍 さいしょの手がかりを調べる';
    document.getElementById('accuseHint').textContent = 'まずは手がかりを1つ調べよう。';
    Game.updateLevelToggle();
  },

  buildGrid: function (range) {
    var grid = document.getElementById('numberGrid');
    grid.innerHTML = '';
    for (var n = 1; n <= range; n++) {
      var cell = document.createElement('div');
      cell.className = 'cell suspect';
      cell.textContent = n;
      cell.dataset.n = n;
      (function (num, el) {
        el.addEventListener('pointerdown', function (e) { e.preventDefault(); Game.onDown(num, el); });
        el.addEventListener('pointerenter', function () { Game.onEnter(num, el); });
      })(n, cell);
      grid.appendChild(cell);
    }
    if (!Game._upBound) {
      document.addEventListener('pointerup', function () { Game.onUp(); });
      Game._upBound = true;
    }
  },

  /* ---- ポインタ操作（タップ＋ドラッグ選択） ---- */
  onDown: function (n, el) {
    if (Game.solved) return;
    Game.dragging = true; Game.dragMoved = false; Game.downProcessed = false; Game.downRef = { n: n, el: el };
  },
  onEnter: function (n, el) {
    if (!Game.dragging || Game.solved) return;
    Game.dragMoved = true;
    if (!Game.downProcessed) { Game.keep(Game.downRef.n, Game.downRef.el, true); Game.downProcessed = true; }
    Game.keep(n, el, true);
  },
  onUp: function () {
    if (!Game.dragging) return;
    Game.dragging = false;
    if (!Game.dragMoved && Game.downRef) Game.keep(Game.downRef.n, Game.downRef.el, false);
    Game.downRef = null;
  },

  /** マスをえらぶ（silent=true はドラッグ中でヒントを出さない） */
  keep: function (n, el, silent) {
    if (Game.solved) return;
    if (!Game.selecting) {
      // 保険モード（全手がかりを使っても複数のこったとき）＝タップで告発
      if (Game.finalGuess && Game.alive[n]) {
        if (n === Game.puzzle.secret) Game.winSequence(n);
        else if (!silent) { UI.nudge(el); UI.toast('ちがうみたい。よく見て！'); }
      } else if (!silent) UI.toast('まず「手がかりを調べる」を押してね');
      return;
    }
    if (!Game.alive[n]) { if (!silent) UI.toast('その数は もう消えているよ'); return; }
    if (Game.matchSet[n]) {
      if (Game.kept[n]) return;
      Game.kept[n] = true; Game.keptCount++;
      Game.bumpHeat(el);
      Game.updateCounter();
      if (Game.keptCount >= Game.matchCount) Game.completeRound();
    } else {
      if (!silent) { UI.nudge(el); UI.toast('それは「' + Game.curHint.short + '」じゃないみたい。よく見て！'); }
    }
  },

  bumpHeat: function (el) {
    var h = (Number(el.dataset.heat) || 0) + 1;
    el.dataset.heat = h;
    el.classList.remove('heat1', 'heat2', 'heat3', 'heat4', 'heat5', 'heat6');
    el.classList.add('heat' + Math.min(h, 6));
    el.classList.add('kept-pop');
    setTimeout(function () { el.classList.remove('kept-pop'); }, 260);
  },

  updateCounter: function () {
    var remain = Game.matchCount - Game.keptCount;
    document.getElementById('accuseHint').innerHTML =
      '👉 <b>' + Game.curHint.short + '</b> のマスを ぜんぶタップ！（のこり <b>' + remain + '</b>）';
    document.getElementById('revealBtn').textContent = 'ヒント（のこり ' + remain + ' マス）';
  },

  /** ボタン：選択中はヒント、そうでなければ次の手がかり */
  revealNext: function () {
    if (Game.solved) return;
    if (Game.selecting) { Game.hintRemaining(); return; }
    if (Game.roundIdx + 1 >= Game.puzzle.hints.length) return;
    Game.revealClue();
  },

  hintRemaining: function () {
    var cells = document.querySelectorAll('#numberGrid .cell');
    var shown = 0;
    cells.forEach(function (c) {
      var n = Number(c.dataset.n);
      if (Game.matchSet[n] && !Game.kept[n]) { c.classList.add('pulse'); setTimeout(function () { c.classList.remove('pulse'); }, 1200); shown++; }
    });
    UI.toast('あと ' + (Game.matchCount - Game.keptCount) + ' マス！「' + Game.curHint.short + '」をさがそう');
  },

  revealClue: function () {
    Game.roundIdx++;
    var hint = Game.puzzle.hints[Game.roundIdx];
    Game.curHint = hint;
    if (Game.roundIdx === 0) document.getElementById('clueList').innerHTML = '';
    var card = document.createElement('div');
    card.className = 'clue-card cat-' + hint.cat;
    card.innerHTML = '<span class="cc-tag">' + hint.tag + '</span><span class="cc-text">' + hint.text + '</span>';
    document.getElementById('clueList').appendChild(card);
    document.getElementById('usedHints').textContent = Game.roundIdx + 1;

    Game.matchList = [];
    Object.keys(Game.alive).forEach(function (k) { var n = Number(k); if (hint.match(n)) Game.matchList.push(n); });
    Game.matchSet = {}; Game.matchList.forEach(function (n) { Game.matchSet[n] = true; });
    Game.matchCount = Game.matchList.length;
    Game.kept = {}; Game.keptCount = 0;
    Game.selecting = true;
    document.getElementById('revealBtn').disabled = false;
    Game.updateCounter();
  },

  completeRound: function () {
    // 合わないマスを消す
    var cells = document.querySelectorAll('#numberGrid .cell');
    cells.forEach(function (c) {
      var n = Number(c.dataset.n);
      if (Game.alive[n] && !Game.matchSet[n]) {
        c.classList.add('dead'); c.classList.remove('suspect');
        c.classList.remove('heat1', 'heat2', 'heat3', 'heat4', 'heat5', 'heat6');
      }
    });
    Game.alive = {}; Game.matchList.forEach(function (n) { Game.alive[n] = true; });
    Game.selecting = false;
    document.getElementById('candidateCount').textContent = Game.matchCount;

    if (Game.matchCount === 1) { Game.winSequence(Game.matchList[0]); return; }
    if (Game.roundIdx + 1 >= Game.puzzle.hints.length) {
      Game.finalGuess = true;
      document.getElementById('revealBtn').disabled = true;
      document.getElementById('revealBtn').textContent = '証拠は出そろった！';
      document.getElementById('accuseHint').innerHTML = 'のこった中から <b>犯人をタップ</b> して告発！';
      return;
    }
    var btn = document.getElementById('revealBtn');
    btn.disabled = false; btn.textContent = '🔍 次の手がかりを調べる';
    document.getElementById('accuseHint').innerHTML = 'しぼりこめた！ 次の証拠を調べよう。（のこり <b>' + Game.matchCount + '</b> 人）';
  },

  winSequence: function (n) {
    Game.solved = true; Game.selecting = false;
    var btn = document.getElementById('revealBtn');
    btn.disabled = true; btn.textContent = '🎉 事件かいけつ！';
    document.getElementById('accuseHint').textContent = '';
    var grid = document.getElementById('numberGrid');
    var target = null;
    grid.querySelectorAll('.cell').forEach(function (c) {
      c.classList.remove('suspect', 'pulse');
      if (Number(c.dataset.n) === n) target = c;
    });
    grid.classList.add('revealing');           // 周りを暗くする
    if (target) target.classList.add('answer', 'spotlight');

    var used = Game.roundIdx + 1, total = Game.puzzle.hints.length, sharp = used < total;
    Progress.award(used);
    setTimeout(function () {
      var msg = '真犯人は「' + n + '」だった！\n調べた手がかり：' + used + ' / ' + total + '　🏅バッジ +1';
      if (sharp) msg = '⚡ するどい推理！ ' + used + 'つの手がかりで見やぶった！\n' + msg;
      UI.winReveal(sharp ? 'みごと解決！' : '事件かいけつ！', msg, n);
    }, 1200);
  }
};

/* ============================================================
 *  Highlight: 重ねて分析（公倍数・公約数）
 * ============================================================ */
var Highlight = {
  mode: 'multiple',
  init: function () { Highlight.render(); },
  setMode: function (m) {
    Highlight.mode = m;
    document.getElementById('segMultiple').classList.toggle('active', m === 'multiple');
    document.getElementById('segDivisor').classList.toggle('active', m === 'divisor');
    var kind = m === 'multiple' ? '倍数' : '約数';
    document.getElementById('lgKind1').textContent = kind;
    document.getElementById('lgKind2').textContent = kind;
    document.getElementById('lgBoth').textContent = m === 'multiple' ? '公倍数' : '公約数';
    Highlight.render();
  },
  render: function () {
    var a = Math.max(1, Math.min(100, Number(document.getElementById('hlA').value) || 2));
    var b = Math.max(1, Math.min(100, Number(document.getElementById('hlB').value) || 3));
    var range = APP.range;
    UI.buildGrid(document.getElementById('hlGrid'), range);
    var cells = document.querySelectorAll('#hlGrid .cell');
    var both = [];
    cells.forEach(function (c) {
      var n = Number(c.dataset.n), inA, inB;
      if (Highlight.mode === 'multiple') { inA = n % a === 0; inB = n % b === 0; }
      else { inA = a % n === 0; inB = b % n === 0; }
      c.classList.remove('hl-a', 'hl-b', 'hl-both');
      if (inA && inB) { c.classList.add('hl-both'); both.push(n); }
      else if (inA) c.classList.add('hl-a');
      else if (inB) c.classList.add('hl-b');
    });
    var q = document.getElementById('hlQuestion');
    if (Highlight.mode === 'multiple') {
      var lcm = both.length ? both[0] : '（はんいの中に無いよ）';
      q.innerHTML = '❓ ハイライト（' + a + 'と' + b + 'の公倍数）の中で <b>いちばん小さい数</b> は？' +
        '<div class="q-answer">👉 最小公倍数は <b>' + lcm + '</b>' +
        (both.length ? '　／ 公倍数：' + both.join('、 ') : '') + '</div>';
    } else {
      var gcd = both.length ? both[both.length - 1] : '（無いよ）';
      q.innerHTML = '❓ ハイライト（' + a + 'と' + b + 'の公約数）の中で <b>いちばん大きい数</b> は？' +
        '<div class="q-answer">👉 最大公約数は <b>' + gcd + '</b>' +
        (both.length ? '　／ 公約数：' + both.join('、 ') : '') + '</div>';
    }
  }
};

/* ============================================================
 *  Create: 挑戦状づくり
 * ============================================================ */
var Create = {
  rows: [],
  range: function () { return Progress.personalRange(); },
  init: function () {
    document.getElementById('createMax').textContent = Create.range();
    document.getElementById('createSecret').max = Create.range();
    Create.rows = [];
    Create.renderBuilder();
    Create.renderAddButtons();
    Create.recalc();
    Create.loadGallery();
  },
  /** 追加できる手がかりの種類（基本＋“探偵レベルで解禁ずみ”の単元） */
  addButtons: function () {
    var btns = [
      { key: 'gt', label: '＋ ◯より大きい', color: 'var(--c-basic)' },
      { key: 'lt', label: '＋ ◯より小さい', color: 'var(--c-basic)' },
      { key: 'ones', label: '＋ 一の位', color: 'var(--c-basic)' }
    ];
    Progress.personalCats().forEach(function (cat) {
      btns.push({ key: cat, label: '＋ ' + CATS[cat].name, color: 'var(--c-' + cat + ')' });
    });
    return btns;
  },
  renderAddButtons: function () {
    var row = document.getElementById('addHintRow');
    row.innerHTML = '';
    Create.addButtons().forEach(function (b) {
      var el = document.createElement('button');
      el.className = 'add-chip';
      el.style.background = b.color;
      el.textContent = b.label;
      el.onclick = function () { Create.addRow(b.key); };
      row.appendChild(el);
    });
    // まだ解禁されていない手がかりを、解禁条件つきで表示（自己学習の目標に）
    var next = Progress.nextUnlock();
    if (next) {
      var lock = document.createElement('span');
      lock.className = 'lock-chip';
      lock.textContent = '🔒 ' + CATS[next.cat].name + '（あと ' + (next.min - APP.badges) + ' 事件で解禁）';
      row.appendChild(lock);
    }
  },
  addRow: function (key) {
    if (Create.rows.length >= 4) { UI.toast('手がかりは4こまでだよ'); return; }
    var def;
    if (key === 'gt') def = { cat: 'basic', kind: 'gt', v: 10 };
    else if (key === 'lt') def = { cat: 'basic', kind: 'lt', v: 30 };
    else if (key === 'ones') def = { cat: 'basic', kind: 'ones', d: 2 };
    else if (key === 'parity') def = { cat: 'parity', parity: 'even' };
    else if (key === 'multiple') def = { cat: 'multiple', k: 3 };
    else if (key === 'divisor') def = { cat: 'divisor', k: 12 };
    else if (key === 'cmul') def = { cat: 'cmul', a: 2, b: 3 };
    else if (key === 'cdiv') def = { cat: 'cdiv', a: 12, b: 18 };
    Create.rows.push(def);
    Create.renderBuilder();
    Create.recalc();
  },
  renderBuilder: function () {
    var wrap = document.getElementById('hintBuilder');
    wrap.innerHTML = '';
    Create.rows.forEach(function (def, i) {
      var color = def.cat === 'basic' ? 'var(--c-basic)' : 'var(--c-' + def.cat + ')';
      var div = document.createElement('div');
      div.className = 'hint-row';
      div.style.background = color;
      var inner = '';
      if (def.cat === 'basic') {
        if (def.kind === 'gt') inner = '犯人は <input type="number" value="' + def.v + '" data-i="' + i + '" data-f="v"> より 大きい';
        else if (def.kind === 'lt') inner = '犯人は <input type="number" value="' + def.v + '" data-i="' + i + '" data-f="v"> より 小さい';
        else if (def.kind === 'ones') inner = '一の位は <input type="number" min="0" max="9" value="' + def.d + '" data-i="' + i + '" data-f="d">';
      } else if (def.cat === 'parity') {
        inner = '<select data-i="' + i + '" data-f="parity"><option value="even"' + (def.parity === 'even' ? ' selected' : '') + '>偶数</option><option value="odd"' + (def.parity === 'odd' ? ' selected' : '') + '>奇数</option></select>';
      } else if (def.cat === 'multiple' || def.cat === 'divisor') {
        inner = '<input type="number" min="1" value="' + def.k + '" data-i="' + i + '" data-f="k"> の' + (def.cat === 'multiple' ? '倍数' : '約数');
      } else {
        inner = '<input type="number" min="1" value="' + def.a + '" data-i="' + i + '" data-f="a"> と <input type="number" min="1" value="' + def.b + '" data-i="' + i + '" data-f="b"> の' + (def.cat === 'cmul' ? '公倍数' : '公約数');
      }
      div.innerHTML = '<span>' + (CATS[def.cat] ? CATS[def.cat].icon : '📎') + '</span> <span>' + inner + '</span>' +
        '<button class="rm" data-i="' + i + '">けす</button>';
      wrap.appendChild(div);
    });
    wrap.querySelectorAll('input, select').forEach(function (el) {
      el.addEventListener('input', function () {
        var i = Number(el.dataset.i), f = el.dataset.f;
        Create.rows[i][f] = f === 'parity' ? el.value : Number(el.value);
        Create.recalc();
      });
    });
    wrap.querySelectorAll('.rm').forEach(function (btn) {
      btn.addEventListener('click', function () {
        Create.rows.splice(Number(btn.dataset.i), 1);
        Create.renderBuilder(); Create.recalc();
      });
    });
  },
  toHints: function () {
    return Create.rows.map(function (def) {
      var d;
      if (def.cat === 'basic') d = { category: 'basic', kind: def.kind, v: def.v, d: def.d, k: def.k };
      else if (def.cat === 'parity') d = { category: 'parity', parity: def.parity };
      else if (def.cat === 'multiple' || def.cat === 'divisor') d = { category: def.cat, k: def.k };
      else d = { category: def.cat, a: def.a, b: def.b };
      return Engine.makeHint(d);
    });
  },
  recalc: function () {
    var hints = Create.toHints();
    var cand = Engine.candidates(hints, Create.range());
    document.getElementById('createCandidates').textContent = cand.length;
    var secret = Number(document.getElementById('createSecret').value);
    var note = document.getElementById('createNote');
    if (!hints.length) { note.textContent = '手がかりを2こ以上えらぼう。'; return; }
    if (cand.indexOf(secret) < 0) note.textContent = '⚠️ ひみつの数「' + secret + '」が手がかりに合わないよ。';
    else if (cand.length === 1) note.textContent = '✅ ばっちり！ 犯人は1人にしぼれているよ。';
    else note.textContent = 'あと ' + (cand.length - 1) + ' 人 容ぎ者がいる。手がかりを足して1人にしぼろう。';
  },
  save: function () {
    var secret = Number(document.getElementById('createSecret').value);
    var hints = Create.toHints();
    var cand = Engine.candidates(hints, Create.range());
    if (hints.length < 2) { UI.toast('手がかりは2こ以上つけてね'); return; }
    if (cand.indexOf(secret) < 0) { UI.toast('ひみつの数が手がかりに合っていないよ'); return; }
    var problem = {
      secret: secret, range: Create.range(),
      hints: hints.map(function (h) { return h.desc; }),
      author: document.getElementById('createAuthor').value || APP.name || 'ななし探偵',
      candidates: cand.length
    };
    Server.call('saveProblem', [problem]).then(function () {
      UI.overlay('📨', '挑戦状 完成！', 'みんなの未解決事件にくわわったよ。\nなかまに挑戦してもらおう！', '受理');
      Create.loadGallery();
    }).catch(function () {
      var list = JSON.parse(localStorage.getItem('problems') || '[]');
      problem.id = 'local' + Date.now();
      list.push(problem); localStorage.setItem('problems', JSON.stringify(list));
      UI.overlay('📨', '挑戦状 完成！（この端末に保存）', 'みんなの未解決事件にくわわったよ。', '受理');
      Create.loadGallery();
    });
  },
  loadGallery: function () {
    var box = document.getElementById('galleryList');
    box.innerHTML = '<p class="muted">よみこみ中…</p>';
    Server.call('listProblems', [30]).then(Create.renderGallery).catch(function () {
      Create.renderGallery(JSON.parse(localStorage.getItem('problems') || '[]').slice().reverse());
    });
  },
  renderGallery: function (list) {
    var box = document.getElementById('galleryList');
    if (!list || !list.length) { box.innerHTML = '<p class="muted">まだ事件がないよ。さいしょの挑戦状をつくろう！</p>'; return; }
    box.innerHTML = '';
    list.forEach(function (p) {
      var item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = '<div><div class="gi-author">🖋 ' + (p.author || 'ななし探偵') + '</div>' +
        '<div class="gi-meta">手がかり' + (p.hints ? p.hints.length : 0) + 'こ ／ 現場1〜' + p.range + '</div></div>';
      var btn = document.createElement('button');
      btn.textContent = '挑戦';
      btn.onclick = function () { Create.play(p); };
      item.appendChild(btn);
      box.appendChild(item);
    });
  },
  play: function (p) {
    var hints = (p.hints || []).map(function (d) { return Engine.makeHint(d); });
    APP.range = p.range;
    Nav.go('game');
    Game.setup({ secret: p.secret, range: p.range, hints: hints }, p.range,
      '🖋 ' + (p.author || 'ななし探偵') + ' からの挑戦状！ ひみつの数を見やぶれ。');
  }
};

/* ============================================================
 *  Group: グループ対決
 * ============================================================ */
var Group = {
  startTime: 0, hostPuzzle: null, hostRevealed: 0,
  init: function () { Group.tab('solve'); },
  tab: function (which) {
    ['Solve', 'Host', 'Board'].forEach(function (t) {
      document.getElementById('group' + t).classList.toggle('hidden', t.toLowerCase() !== which);
    });
    document.getElementById('gtSolve').classList.toggle('active', which === 'solve');
    document.getElementById('gtHost').classList.toggle('active', which === 'host');
    document.getElementById('gtBoard').classList.toggle('active', which === 'board');
    if (which === 'solve') {
      Group.startTime = Date.now();
      UI.buildGrid(document.getElementById('groupGrid'), APP.range, {
        suspect: true, onTap: function (n, el) { el.classList.toggle('dead'); Group.checkCorrect(n, el); }
      });
    } else if (which === 'board') Group.loadBoard();
  },
  checkCorrect: function (n, el) {
    // 出題中の秘密の数と一致したら得点記録
    if (Group.hostPuzzle && n === Group.hostPuzzle.secret && !el.classList.contains('dead')) {
      Group.submitCorrect();
    }
  },
  submitCorrect: function () {
    var name = document.getElementById('groupName').value || 'グループ';
    var timeSec = Math.round((Date.now() - Group.startTime) / 1000);
    var hintsUsed = Group.hostRevealed || 0;
    var score = Group.computeScore(timeSec, hintsUsed);
    Server.call('saveScore', [{ session: APP.groupSession, groupName: name, score: score, hintsUsed: hintsUsed, timeSec: timeSec }])
      .then(function () { Group.afterSubmit(name, score, timeSec); })
      .catch(function () {
        var list = JSON.parse(localStorage.getItem('scores') || '[]');
        list.push({ session: APP.groupSession, group_name: name, score: score, hints_used: hintsUsed });
        localStorage.setItem('scores', JSON.stringify(list));
        Group.afterSubmit(name, score, timeSec);
      });
  },
  afterSubmit: function (name, score, timeSec) {
    UI.overlay('🏆', '解決！', name + ' に ' + score + ' 点！（' + timeSec + '秒）\nスコアボードで確認しよう。', '得点');
  },
  /** スコア計算式（仮・調整しやすいよう1か所に） */
  computeScore: function (timeSec, hintsUsed) {
    var base = 100, speedBonus = Math.max(0, 60 - timeSec), hintPenalty = hintsUsed * 8;
    return Math.max(10, base + speedBonus - hintPenalty);
  },
  hostAuto: function () {
    var secret = Number(document.getElementById('hostSecret').value) || 24;
    var res = Engine.greedy(Engine.buildPool(secret, APP.cats, APP.range), APP.range, 5);
    Group.hostPuzzle = { secret: secret, hints: res.hints };
    Group.hostRevealed = 0;
    document.getElementById('hostClues').innerHTML =
      '<p class="muted">ひみつの数は ' + secret + '。「次の手がかりを出す」でスクリーンに1つずつ出そう。</p>';
    UI.toast('出題を用意したよ');
  },
  hostReveal: function () {
    if (!Group.hostPuzzle) { Group.hostAuto(); }
    var idx = Group.hostRevealed;
    if (idx >= Group.hostPuzzle.hints.length) { UI.toast('手がかりは出しきったよ'); return; }
    if (idx === 0) document.getElementById('hostClues').innerHTML = '';
    var hint = Group.hostPuzzle.hints[idx];
    var div = document.createElement('div');
    div.className = 'host-clue';
    div.style.background = hint.cat === 'basic' ? 'var(--c-basic)' : 'var(--c-' + hint.cat + ')';
    div.textContent = hint.tag + '：' + hint.text;
    document.getElementById('hostClues').appendChild(div);
    Group.hostRevealed++;
  },
  loadBoard: function () {
    var box = document.getElementById('scoreboard');
    box.innerHTML = '<p class="muted">よみこみ中…</p>';
    Server.call('listScores', [APP.groupSession]).then(Group.renderBoard).catch(function () {
      var raw = JSON.parse(localStorage.getItem('scores') || '[]'), byGroup = {};
      raw.forEach(function (r) {
        var g = r.group_name; if (!byGroup[g]) byGroup[g] = { groupName: g, score: 0, hintsUsed: 0, plays: 0 };
        byGroup[g].score += r.score; byGroup[g].hintsUsed += r.hints_used; byGroup[g].plays++;
      });
      var board = Object.keys(byGroup).map(function (k) { return byGroup[k]; });
      board.sort(function (a, b) { return b.score - a.score; });
      Group.renderBoard(board);
    });
  },
  renderBoard: function (board) {
    var box = document.getElementById('scoreboard');
    if (!board || !board.length) { box.innerHTML = '<p class="muted">まだスコアがないよ。捜査してみよう！</p>'; return; }
    var medals = ['🥇', '🥈', '🥉'];
    box.innerHTML = '';
    board.forEach(function (r, i) {
      var row = document.createElement('div');
      row.className = 'sb-row' + (i === 0 ? ' top1' : '');
      row.innerHTML = '<div class="sb-rank">' + (medals[i] || (i + 1)) + '</div>' +
        '<div class="sb-name">' + r.groupName + '<div class="sb-sub">' + r.plays + '回 ／ ヒント計' + r.hintsUsed + '</div></div>' +
        '<div class="sb-score">' + r.score + '</div>';
      box.appendChild(row);
    });
  }
};

/* ============================================================
 *  Dex: 手がかり図鑑・解禁マップ・ランク
 * ============================================================ */
var Dex = {
  render: function () {
    var rank = Progress.rankFor(APP.badges);
    var next = null;
    for (var i = 0; i < RANKS.length; i++) { if (RANKS[i].min > APP.badges) { next = RANKS[i]; break; } }
    var progress = next ? Math.round((APP.badges - rank.min) / (next.min - rank.min) * 100) : 100;
    document.getElementById('rankPanel').innerHTML =
      '<div class="rank-big">' + rank.icon + '</div>' +
      '<div class="rank-title">' + rank.name + '</div>' +
      '<div class="rank-stats"><div>解決した事件<b>' + APP.solved + '</b></div>' +
      '<div>バッジ<b>' + APP.badges + '</b></div>' +
      '<div>最少手がかり<b>' + (APP.bestClues || '–') + '</b></div></div>' +
      '<div class="rank-bar"><span style="width:' + progress + '%"></span></div>' +
      '<div class="muted">' + (next ? 'つぎのランク「' + next.name + '」まで あと ' + (next.min - APP.badges) + '事件' : '最高ランク！さすが名探偵！') + '</div>';

    // 解禁マップ（フェーズ＝手がかりの解禁ステップ）
    var steps = [
      { cat: 'basic', icon: '📎', name: '基本の手がかり', desc: '大小・一の位・けた（いつでも使える）', phase: 0 },
      { cat: 'parity', icon: CATS.parity.icon, name: '偶数・奇数', desc: '2でわりきれるかどうか', phase: 1 },
      { cat: 'multiple', icon: CATS.multiple.icon, name: '倍数', desc: '◯の倍数かどうか', phase: 2 },
      { cat: 'divisor', icon: CATS.divisor.icon, name: '約数', desc: '◯の約数かどうか', phase: 3 },
      { cat: 'cmul', icon: CATS.cmul.icon, name: '公倍数', desc: '2つの数 両方の倍数', phase: 4 },
      { cat: 'cdiv', icon: CATS.cdiv.icon, name: '公約数', desc: '2つの数 両方の約数', phase: 5 }
    ];
    var personal = Progress.personalCats();
    var map = document.getElementById('dexMap');
    map.innerHTML = '';
    steps.forEach(function (s) {
      var byClass = s.phase === 0 || APP.cats.indexOf(s.cat) >= 0;
      var byLevel = s.phase === 0 || personal.indexOf(s.cat) >= 0;
      var unlocked = byClass || byLevel;
      var isNow = s.phase === APP.phase;
      var node = document.createElement('div');
      node.className = 'dex-node' + (unlocked ? '' : ' locked') + (isNow ? ' current' : '');
      node.style.borderLeftColor = 'var(--c-' + s.cat + ')';
      var badge;
      if (s.phase === 0) badge = '<span class="dn-badge on">いつでも</span>';
      else if (byClass && isNow) badge = '<span class="dn-badge now">クラスで解禁中</span>';
      else if (unlocked) badge = '<span class="dn-badge on">' + (byClass ? '解禁ずみ' : '🎓レベル解禁') + '</span>';
      else {
        var lv = LEVEL_UNLOCK.filter(function (u) { return u.cat === s.cat; })[0];
        var lvTxt = lv ? '／🎓あと' + (lv.min - APP.badges) + '事件' : '';
        badge = '<span class="dn-badge off">🔒フェーズ' + s.phase + lvTxt + '</span>';
      }
      node.innerHTML = '<div class="dn-phase">' + (s.phase === 0 ? '基' : s.phase) + '</div>' +
        '<div class="dn-body"><div class="dn-name"><span class="dn-icon">' + s.icon + '</span>' + s.name + '</div>' +
        '<div class="dn-desc">' + s.desc + '</div></div>' + badge;
      map.appendChild(node);
    });

    var examReady = APP.phase >= 6;
    document.getElementById('examCta').innerHTML =
      '<button class="exam-btn" ' + (examReady ? '' : 'disabled') + ' onclick="Dex.exam()">' +
      (examReady ? '👑 名探偵 認定試験にちょうせん！' : '🔒 名探偵 認定試験（フェーズ6で解禁）') + '</button>';
  },
  exam: function () {
    APP.range = 100;
    Nav.go('game');
    Game.setup(Engine.generatePuzzle(PHASES[5].cats, 100), 100,
      '👑 認定試験：すべての手がかりを使って、ひみつの数を見やぶれ！');
  }
};

/* ============================================================
 *  Progress: バッジ・ランク・クラウド保存
 * ============================================================ */
var Progress = {
  rankFor: function (badges) {
    var r = RANKS[0];
    RANKS.forEach(function (x) { if (badges >= x.min) r = x; });
    return r;
  },
  /** 探偵レベル（バッジ数）で個人的に解禁されている単元カテゴリ */
  personalCats: function () {
    return LEVEL_UNLOCK.filter(function (u) { return APP.badges >= u.min; }).map(function (u) { return u.cat; });
  },
  personalRange: function () { return APP.badges >= LEVEL_RANGE100 ? 100 : 50; },
  /** つぎに個人解禁される手がかり（無ければ null） */
  nextUnlock: function () {
    for (var i = 0; i < LEVEL_UNLOCK.length; i++) {
      if (APP.badges < LEVEL_UNLOCK[i].min) return LEVEL_UNLOCK[i];
    }
    return null;
  },
  award: function (cluesUsed) {
    var before = Progress.rankFor(APP.badges);
    APP.badges++; APP.solved++;
    if (!APP.bestClues || cluesUsed < APP.bestClues) APP.bestClues = cluesUsed;
    var after = Progress.rankFor(APP.badges);
    UI.refreshRankChip();
    Progress.save();
    if (after.name !== before.name) {
      setTimeout(function () {
        UI.overlay('⬆️', 'ランクアップ！', '「' + after.name + '」に昇格！ ' + after.icon + '\nつぎの事件も待っているぞ。', '昇格');
      }, 1700);
    }
  },
  /** クラウド（スプレッドシート）＋端末キャッシュに保存 */
  save: function () {
    var rank = Progress.rankFor(APP.badges).name;
    localStorage.setItem('progress', JSON.stringify({ badges: APP.badges, solved: APP.solved, bestClues: APP.bestClues, name: APP.name }));
    Server.call('saveProgress', [{
      userId: APP.userId, name: APP.name, badges: APP.badges, rank: rank,
      solved: APP.solved, bestClues: APP.bestClues, unlocked: APP.cats
    }]).catch(function () {});
  }
};

/* ============================================================
 *  Settings: 単元フェーズ切替（教員）
 * ============================================================ */
var Settings = {
  passSet: false,
  /** 入口：パスワードで守る（設定済み かつ 未解除なら ゲートを表示） */
  render: function () {
    Server.call('isTeacherPassSet', []).then(function (isSet) {
      Settings.passSet = !!isSet;
      if (isSet && !APP.teacherUnlocked) Settings.showGate();
      else Settings.showMain();
    }).catch(function () {
      // GAS 非接続（プレビュー）ではロックせず開く
      Settings.passSet = false; Settings.showMain();
    });
  },
  showGate: function () {
    document.getElementById('settingsGate').classList.remove('hidden');
    document.getElementById('settingsMain').classList.add('hidden');
    document.getElementById('gatePass').value = '';
    setTimeout(function () { document.getElementById('gatePass').focus(); }, 100);
  },
  unlock: function () {
    var pw = document.getElementById('gatePass').value;
    Server.call('checkTeacherPass', [pw]).then(function (ok) {
      if (ok) { APP.teacherUnlocked = true; Settings.showMain(); UI.toast('ロックを解除しました'); }
      else UI.toast('パスワードが ちがいます');
    }).catch(function () { APP.teacherUnlocked = true; Settings.showMain(); });
  },
  showMain: function () {
    document.getElementById('settingsGate').classList.add('hidden');
    document.getElementById('settingsMain').classList.remove('hidden');
    var list = document.getElementById('phaseList');
    list.innerHTML = '';
    PHASES.forEach(function (ph) {
      var opt = document.createElement('div');
      opt.className = 'phase-opt' + (ph.n === APP.phase ? ' active' : '');
      var catNames = ph.cats.map(function (c) { return CATS[c].name; }).join('・');
      opt.innerHTML = '<div class="po-num">' + ph.n + '</div>' +
        '<div><div>' + ph.name + '</div><div class="po-sub">現場1〜' + ph.range + ' ／ ' + catNames + '</div></div>';
      opt.onclick = function () { Settings.setPhase(ph.n); };
      list.appendChild(opt);
    });
    document.getElementById('sessionName').value = APP.groupSession || '';
    var who = APP.usingEmail
      ? '記録の保存先：<b>' + APP.userId + '</b>（Googleアカウント／クラウド保存。端末を変えても記録が続きます）'
      : '記録の保存先：この端末（名前：' + APP.name + '）。GAS公開＋Googleログインでクラウド保存に切りかわります。';
    document.getElementById('whoami').innerHTML = '🗄 ' + who;
    document.getElementById('passStatus').textContent = Settings.passSet
      ? '🔒 パスワード設定ずみ' : '🔓 パスワード未設定（だれでも開けます）';
    document.getElementById('passOldRow').style.display = Settings.passSet ? '' : 'none';
  },
  savePass: function () {
    var oldP = document.getElementById('passOld').value;
    var newP = document.getElementById('passNew').value;
    Server.call('setTeacherPass', [oldP, newP]).then(function (res) {
      if (res && res.ok) {
        UI.toast('パスワードを保存しました');
        APP.teacherUnlocked = true;
        document.getElementById('passOld').value = ''; document.getElementById('passNew').value = '';
        Settings.render();
      } else UI.toast((res && res.reason) || 'ほぞんできませんでした');
    }).catch(function () { UI.toast('この画面ではパスワードを保存できません（GAS公開後に使えます）'); });
  },
  setPhase: function (n) {
    var prevRange = APP.range;
    Settings.applyPhase(n);
    Settings.render(); Home.render();
    Server.call('setConfig', ['phase', n]).catch(function () {});
    localStorage.setItem('phase', n);
    if (prevRange === 50 && APP.range === 100) {
      UI.overlay('✨', 'LEVEL UP！', '現場が 1〜100 に広がった！\n公倍数・公約数の手がかりも解禁だ。', 'LEVEL UP');
    } else {
      UI.toast('フェーズ' + n + '「' + PHASES[n - 1].name + '」に切りかえたよ');
    }
  },
  applyPhase: function (n) {
    var ph = PHASES[n - 1];
    APP.phase = n; APP.cats = ph.cats.slice(); APP.range = ph.range;
  },
  saveSession: function () {
    APP.groupSession = document.getElementById('sessionName').value || '';
    localStorage.setItem('groupSession', APP.groupSession);
    Server.call('setConfig', ['groupSession', APP.groupSession]).catch(function () {});
    UI.toast('セッション名を保存したよ');
  }
};

/* ============================================================
 *  HowTo: あそびかた
 * ============================================================ */
var HowTo = {
  steps: [
    '事件ファイルには「<b>ひみつの数</b>」が1つだけ かくれている。現場（数表）から見つけ出そう。',
    '「<b>手がかりを調べる</b>」で証拠が1つ出る。その手がかりに<b>合う数を、自分で全部タップ</b>してえらぼう（ドラッグでもOK）。',
    '合う数を全部えらぶと、<b>合わない数が消え</b>、のこった犯人候補が<b>だんだん濃く</b>なっていくよ。',
    '候補が1人になったら＝<b>真犯人</b>！ 少ない手がかりで見やぶるほど「⚡するどい推理」だ。',
    'わからない言葉は「<b>📖 用語じてん</b>」で確認できるよ。'
  ],
  open: function () {
    var ol = document.getElementById('howtoSteps');
    ol.innerHTML = '';
    HowTo.steps.forEach(function (s) { var li = document.createElement('li'); li.innerHTML = s; ol.appendChild(li); });
    document.getElementById('howto').classList.remove('hidden');
  },
  close: function () {
    document.getElementById('howto').classList.add('hidden');
    localStorage.setItem('seenHowto', '1');
  }
};

/* ============================================================
 *  Glossary: 用語じてん（教科書の定義にそろえた説明）
 *  ホームからも、捜査中からも開ける。
 * ============================================================ */
var Glossary = {
  open: function () {
    var box = document.getElementById('glossaryList');
    box.innerHTML = '';
    GLOSSARY.forEach(function (g) {
      var card = document.createElement('div');
      card.className = 'gl-card';
      card.style.borderLeftColor = 'var(--c-' + g.color + ')';
      card.innerHTML =
        '<div class="gl-term"><b>' + g.term + '</b><span class="gl-yomi">（' + g.yomi + '）</span></div>' +
        '<div class="gl-def">' + g.def + '</div>' +
        '<div class="gl-ex">れい： ' + g.ex + '</div>';
      box.appendChild(card);
    });
    document.getElementById('glossary').classList.remove('hidden');
  },
  close: function () { document.getElementById('glossary').classList.add('hidden'); }
};

/* ============================================================
 *  起動
 * ============================================================ */
(function boot() {
  // 端末キャッシュから復元（オフライン時のフォールバック）
  try {
    var cached = JSON.parse(localStorage.getItem('progress') || '{}');
    APP.badges = cached.badges || 0; APP.solved = cached.solved || 0;
    APP.bestClues = cached.bestClues || 0; if (cached.name) APP.name = cached.name;
  } catch (e) {}
  APP.groupSession = localStorage.getItem('groupSession') || '';
  var localPhase = Number(localStorage.getItem('phase') || 0);

  UI.refreshRankChip();

  // ① ユーザー識別 → ② クラウドの進捗を読み込み → ③ 設定フェーズ
  Server.call('getMe', []).then(function (me) {
    if (me && me.email) { APP.userId = me.email; APP.name = me.name || me.email; APP.usingEmail = true; }
    return Server.call('getProgress', [APP.userId]);
  }).then(function (p) {
    if (p) { APP.badges = p.badges || 0; APP.solved = p.solved || 0; APP.bestClues = p.bestClues || 0; if (p.name) APP.name = p.name; }
    UI.refreshRankChip();
    return Server.call('getConfig', []);
  }).then(function (cfg) {
    Settings.applyPhase((cfg && cfg.phase) || localPhase || 1);
    if (cfg && cfg.groupSession) APP.groupSession = cfg.groupSession;
    Home.render();
  }).catch(function () {
    // GAS 非接続（ローカルプレビュー）
    Settings.applyPhase(localPhase || 1);
    Home.render();
  });

  Nav.go('home');
  // 初回のみ あそびかたを表示
  if (!localStorage.getItem('seenHowto')) setTimeout(HowTo.open, 400);
})();
</script>
